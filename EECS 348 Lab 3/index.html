<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Profile</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #4b6cb7, #182848);
  }

  .card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    padding: 40px 30px;
    width: 320px;
    text-align: center;
  }

  .photo {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #4b6cb7;
    margin-bottom: 20px;
  }

  h1 {
    margin: 0 0 5px 0;
    font-size: 1.5em;
    color: #182848;
  }

  .title {
    color: #666;
    font-size: 0.95em;
    margin-bottom: 15px;
  }

  p.bio {
    color: #444;
    font-size: 0.9em;
    line-height: 1.5;
    margin-bottom: 20px;
  }

  a.link-button {
    display: inline-block;
    text-decoration: none;
    background: #4b6cb7;
    color: #fff;
    padding: 10px 24px;
    border-radius: 25px;
    font-size: 0.9em;
    transition: background 0.2s ease;
  }

  a.link-button:hover {
    background: #182848;
  }

  .profile-video {
    width: 100%;
    max-width: 280px;
    border-radius: 10px;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

  <div class="card">
    <img class="photo" src="selfie.jpeg" alt="Profile photo">
    <h1>Joseph Akins</h1>
    <div class="title">Computer Engineering @ KU</div>
    <p class="bio">
      Junior studying Computer Engineering at the University of Kansas.
    </p>

    <iframe class="profile-video" height="160"
      src="https://www.youtube.com/embed/dQw4w9WgXcQ"
      frameborder="0" allowfullscreen>
    </iframe>

    <a class="link-button" href="https://github.com/" target="_blank">Visit My GitHub</a>
    <br><br>
    <a class="link-button" href="rgb-demo.html">RGB Color Playground</a>
    <br><br>
    <a class="link-button" href="password-check.html">Login</a>
    <br><br>
    <a class="link-button" href="http://localhost:8000/multiplication-table.php">Multiplication Table generator</a>
  </div>

</body>
</html>
